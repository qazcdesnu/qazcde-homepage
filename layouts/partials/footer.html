<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <strong>{{ .Site.Params.author }}</strong>
      <p>{{ .Site.Params.institution }} · {{ .Site.Params.role }}</p>
    </div>

    <div class="footer-links">
      {{ with .Site.Params.social.github }}<a href="{{ . }}" rel="me noopener" target="_blank">GitHub</a>{{ end }}
      <a href="{{ "/blog/" | relURL }}">Blog</a>
      <a href="{{ "/cv/" | relURL }}">CV</a>
    </div>

    <p class="footer-note">© {{ now.Year }} {{ .Site.Params.author }}</p>
  </div>
</footer>
