<!doctype html>
<html lang="{{ .Site.LanguageCode | default "ko-KR" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div class="site-frame">
      {{ partial "header.html" . }}
      <main id="main-content" class="site-main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
